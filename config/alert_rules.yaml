alerts:
  - name: HighLatencyP95Breach
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-2A202602368
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRateOrRetrievalFailure
    severity: critical
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 > 2 or count(tool_success == true) / count(tool_success != null) * 100 < 90'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-2A202602368
    runbook: docs/alerts.md#alert-2
  - name: CostSpikeOrQualityDrop
    severity: warning
    condition: 'sum_24h(response_sent.cost_usd) > 2.5 or mean(response_sent.quality_score) < 0.75'
    duration: 10m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-2A202602368
    runbook: docs/alerts.md#alert-3

